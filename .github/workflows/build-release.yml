name: Build Release

on:
  push:
    tags:
      - 'v*'

# 允许工作流为 Release 上传产物
permissions:
  contents: write

jobs:
  # 先创建 Release（空内容），避免两个构建任务并发创建 Release 时冲突
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # 留给后续构建任务上传文件，这里先不传

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 打包不需要下载 Chromium，跳过以加速并避免失败
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Package for Windows
        env:
          # 无签名时关闭自动签名发现，避免构建失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 如需签名，在此配置以下 secrets（可选）：
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # --publish=never 关闭 electron-builder 的隐式发布（上传交由下方 softprops 步骤处理）
        run: npm run dist:win -- --publish=never

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Package for macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 如需签名 + 公证，配置以下 secrets（可选）：
          # CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --publish=never 关闭 electron-builder 的隐式发布（上传交由下方 softprops 步骤处理）
        run: npm run dist -- --mac --publish=never

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
